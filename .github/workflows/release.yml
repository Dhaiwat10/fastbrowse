name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      # A tag that disagrees with the package version would publish one number under another's name.
      - run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      # The release notes ARE the changelog entry, so the GitHub release, the repository and the site all
      # say the same thing about a version. A tag whose version has no entry fails here rather than
      # publishing notes nobody wrote.
      - run: uv run python scripts/changelog.py "$(uv version --short)" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC identity, so no token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # The site's changelog page reads CHANGELOG.md from `main` at build time and deploys as a static export, so
  # a release is invisible there until the site builds again. This asks it to, once the version is on PyPI and
  # the page's "runs exactly the release below it" is true. `SITE_DEPLOY_HOOK` is a Vercel deploy hook for
  # agent-labs-dev/fastbrowse-site; with no secret set the release still succeeds and the site catches up on
  # its own next push.
  site:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site so its changelog shows this release
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not set: the site will show this release after its next deploy."
            exit 0
          fi
          curl -fsS --retry 3 -X POST "$HOOK" > /dev/null
          echo "asked fastbrowse-site to rebuild"
