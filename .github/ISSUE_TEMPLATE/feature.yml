name: Feature request
description: Something fastbrowse should do that it does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or workflow, and where fastbrowse falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The behaviour or interface you have in mind, if you have one.
