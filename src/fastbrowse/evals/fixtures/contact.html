<!doctype html><html><head><title>Contact support</title></head><body>
<h1>Contact support</h1>
<form action="/submit/contact" method="post">
  <p><label for="name">Your name</label> <input id="name" name="name" required></p>
  <p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
  <p><label for="topic">Topic</label> <select id="topic" name="topic"><option>General</option><option>Damaged item</option><option>Billing</option></select></p>
  <p><label for="message">Message</label> <textarea id="message" name="message" required></textarea></p>
  <button type="submit">Send message</button>
</form></body></html>
